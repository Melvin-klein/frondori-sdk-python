# Tests à chaque push, et publication sur PyPI quand on pousse un tag de
# version (ex. `v0.1.0`).
#
# Publication par "Trusted Publishing" : PyPI fait confiance à CE workflow de
# CE dépôt, sans aucun token stocké. À configurer une fois sur PyPI (projet
# frondori-sdk > Publishing > ajouter un "trusted publisher" GitHub :
# ce dépôt, workflow `ci.yml`, environnement `pypi`).
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Installation
        # frondori-engine vient de PyPI : il doit y être publié AVANT ce paquet.
        run: pip install -e ".[dev]"
      - run: python -m pytest

  build:
    name: Construction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist

  publish:
    name: Publication sur PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/frondori-sdk
    permissions:
      id-token: write   # Trusted Publishing : l'identité du workflow, pas un token
    steps:
      - uses: actions/checkout@v6
      - name: Le tag correspond à la version du paquet
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version v$version de pyproject.toml"; exit 1; }
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
