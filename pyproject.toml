[project]
name = "frondori-sdk"
version = "0.3.0"
description = "SDK Python pour la plateforme de compétition d'IA Frondori (tous environnements)"
requires-python = ">=3.10"
dependencies = [
    "websockets>=12,<13",
    "msgpack>=1.0,<2",
    "numpy>=1.24",
    "gymnasium>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["frondori"]
