[project]
name = "frondori-sdk"
version = "0.4.0"
description = "SDK Python pour la plateforme de compétition d'IA Frondori (tous environnements)"
requires-python = ">=3.10"
dependencies = [
    "websockets>=12,<13",
    "msgpack>=1.0,<2",
    "numpy>=1.24",
    "gymnasium>=1.0",
]

[project.optional-dependencies]
# `local` : jouer en local (`Agent(..., local=True)`) ; il faut aussi le
# paquet de l'environnement voulu (ex. frondori-kitchen).
local = ["frondori-engine>=0.4"]
dev = ["pytest>=7", "frondori-engine>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["frondori"]
