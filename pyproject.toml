[project]
name = "frondori-sdk"
version = "0.5.0"
description = "Python SDK for the Frondori AI competition platform: play any environment online, or locally in competition conditions."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Melvine Nargeot" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "websockets>=12,<13",
    "msgpack>=1.0,<2",
    "numpy>=1.24",
    "gymnasium>=1.0",
]

[project.urls]
Homepage = "https://frondori.com"
Documentation = "https://frondori.com/documentation/sdks"
Source = "https://github.com/Melvin-klein/frondori-sdk-python"
Issues = "https://github.com/Melvin-klein/frondori-sdk-python/issues"

[project.optional-dependencies]
# `local` : jouer en local (`Agent(..., local=True)`) ; il faut aussi le
# paquet de l'environnement voulu (ex. frondori-kitchen).
local = ["frondori-engine>=0.4"]
# `train` : les agents prêts à l'emploi de `frondori.agents` (PPO, DQN, SAC),
# qui ont besoin de PyTorch. Pour un agent "maison", `local` suffit.
train = ["frondori-engine>=0.4", "torch>=2.2"]
dev = ["pytest>=7", "frondori-engine>=0.4"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["frondori", "frondori.agents"]

# Les licences de CleanRL et de ses sources, livrées avec les agents adaptés.
[tool.setuptools.package-data]
"frondori.agents" = ["THIRD_PARTY_LICENSES.md"]
